minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*
  - e2e

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

catalogs:
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@jridgewell/gen-mapping': 0.3.13
    '@types/node': ^26.6.5
    bumpp: ^12.3.0
    eslint: ^10.13.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.43.0
    nano-staged: ^1.0.2
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    tsdown: ^0.23.2
    typescript: ^6.0.3
    vitest: ^5.0.5
  prod:
    '@jridgewell/trace-mapping': 0.3.31
    css-select: ^7.0.0
    domhandler: ^6.0.1
    domutils: ^4.0.2
    htmlparser2: ^12.0.0
    oxc-parser: 0.155.0
    zod: ^4.6.7
