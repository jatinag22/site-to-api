    esbuild: 0.28.2
    eslint: ^10.13.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.43.0
    nano-staged: ^1.0.2
    playwright: ^1.64.1
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    tsdown: ^0.23.2
    typescript: ^6.0.3
    vitest: ^5.0.5
    ws: ^8.22.0
  prod:
    zod: ^4.6.7
