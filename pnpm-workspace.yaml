minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*
  - e2e

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

catalogs:
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@types/node': ^26.6.5
    bumpp: ^12.3.0
    eslint: ^10.13.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.43.0
    nano-staged: ^1.0.2
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    tsdown: ^0.23.2
    typescript: ^6.0.3
    vitest: ^5.0.5
  prod:
    '@hey-api/shared': 0.5.0
    commander: ^15.0.0
    consola: ^3.4.2
    jiti: ^2.7.0
    pathe: ^2.0.3
    zod: ^4.6.7
