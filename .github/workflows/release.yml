name: Release

# Publishing is disabled while the repository is private. To enable it, follow RELEASING.md:
# create the npm packages once, link this workflow as a trusted publisher, then set
# `PUBLISH_ENABLED` to `true` in the repository variables.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Create GitHub release with notes from commits
        run: npx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm (trusted publishing)
        if: vars.PUBLISH_ENABLED == 'true'
        run: pnpm -r publish --access public --no-git-checks --provenance
