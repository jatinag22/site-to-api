name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks on the commit it is about to tag.
  workflow_call:
    inputs:
      ref:
        description: 'Commit to check (default: the triggering commit)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A call from the release workflow gets its own group, so it never cancels or is cancelled by
  # a push to the same ref.
  group: ci-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Capture unit tests launch a real (headless) Chromium.
      - run: pnpm --filter site-to-api exec playwright install --with-deps chromium
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run knip
      - run: pnpm exec vitest --run --project site-to-api --project runtime

  e2e:
    name: End-to-end (capture → build → probe → gen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-to-api exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec vitest --run --project e2e

  package:
    name: Pack, install and smoke-test the packages (Node ${{ matrix.node }})
    # A package that only works inside the workspace (workspace:/catalog: ranges, missing files,
    # a runtime that needs Node) must not merge: pack both, install the tarballs with npm and
    # pnpm into fresh projects, and run capture → build → gen against the fixture site.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/smoke-package.mjs --with-deps
