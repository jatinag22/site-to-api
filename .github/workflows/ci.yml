name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks on the commit it is about to tag, with the
  # package smoke test on the exact tarballs it will publish.
  workflow_call:
    inputs:
      ref:
        description: 'Commit to check (default: the triggering commit)'
        type: string
        default: ''
      tarballs-artifact:
        description: Artifact holding the packed tarballs (and SHA256SUMS) to smoke-test instead of packing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A call from the release workflow gets its own group (its `ref` input), so it never cancels or
  # is cancelled by a push to the same branch.
  group: ci-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Capture unit tests launch a real (headless) Chromium.
      - run: pnpm --filter site-to-api exec playwright install --with-deps chromium
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run knip
      - run: pnpm exec vitest --run --project site-to-api --project runtime

  e2e:
    name: End-to-end (capture → build → probe → gen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site-to-api exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec vitest --run --project e2e

  package-scope:
    name: Package smoke test scope
    # Pull requests run the smoke test once (Node 24, npm), and only when something that ends up
    # in a package changed. Pushes to main and release runs (called with `ref`) get the full matrix.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      nodes: ${{ steps.scope.outputs.nodes }}
      managers: ${{ steps.scope.outputs.managers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && inputs.ref == ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: scope
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' && inputs.ref == '' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$PULL_REQUEST" != "true" ]; then
            { echo "run=true"; echo 'nodes=[22, 24]'; echo 'managers=["npm", "pnpm"]'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...HEAD")
          echo "$changed"
          pattern='^(packages/[^/]+/(package\.json|README|src/|bin/|tsdown\.config\.|tsconfig)|e2e/fixture-site/|scripts/(smoke-package|check-neutral)\.mjs|pnpm-workspace\.yaml|pnpm-lock\.yaml|package\.json|\.github/workflows/ci\.yml)'
          if echo "$changed" | grep -Eq "$pattern"; then run=true; else run=false; fi
          { echo "run=$run"; echo 'nodes=[24]'; echo 'managers=["npm"]'; } >> "$GITHUB_OUTPUT"

  package:
    name: Pack, install and smoke-test (Node ${{ matrix.node }}, ${{ matrix.manager }})
    # A package that only works inside the workspace (workspace:/catalog: ranges, missing files,
    # a runtime that needs Node) must not merge or ship: install the tarballs into fresh
    # projects and run capture → build → gen against the fixture site.
    needs: package-scope
    if: needs.package-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.package-scope.outputs.nodes) }}
        manager: ${{ fromJSON(needs.package-scope.outputs.managers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Download the release tarballs
        if: inputs.tarballs-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tarballs-artifact }}
          path: release-tarballs
      - name: Smoke test
        env:
          MANAGER: ${{ matrix.manager }}
          TARBALLS: ${{ inputs.tarballs-artifact != '' && 'release-tarballs' || '' }}
        run: node scripts/smoke-package.mjs --with-deps --only "$MANAGER" ${TARBALLS:+--tarballs "$TARBALLS"}
