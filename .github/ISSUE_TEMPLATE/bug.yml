name: Bug report
description: Something produced wrong output or failed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands run, config used, and a site or fixture that shows it. Never paste raw captures, cookies or tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: site-to-api version and Node version
    validations:
      required: true
